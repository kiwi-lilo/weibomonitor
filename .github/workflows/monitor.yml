name: 央媒涉陕报道早报

on:
  schedule:
    # 每天 UTC 23:00 执行，即北京时间早上 07:00
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: 安装依赖
        run: pip install requests

      - name: 运行早报生成
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: python main.py

      - name: 保存结果文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "央媒涉陕新闻早报"
          path: "*.csv"
          retention-days: 30
