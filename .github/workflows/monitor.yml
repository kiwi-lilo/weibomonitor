name: 汉中舆情监测

on:
  schedule:
    # 北京时间 23:00 = UTC 15:00
    - cron: '0 15 * * *'

  # 保留手动触发（偶尔测试用）
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行舆情监测
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: python main.py

      - name: 保存结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "舆情报告-${{ github.run_number }}"
          path: |
            汉中舆情_*.csv
            汉中舆情_*.json
          retention-days: 30
