name: 舆情监测

on:
  schedule:
    - cron: '0 20 * * 0-4'   # 北京时间周一至周五 04:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # transformer 情感模型：依赖与模型均有缓存，仅首次运行慢几分钟。
      # 模型下载失败时代码会自动降级到内置 lite 词典引擎，不会中断日报。
      - name: 安装情感模型依赖（CPU版torch，有pip缓存）
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers

      - name: 缓存情感模型（首次下载约400MB，之后秒级恢复）
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-erlangshen-sentiment-v1

      # 恢复跨天 seen 状态（cache key 不可复用，用 restore-keys 取最近一次）
      - name: 恢复历史状态
        uses: actions/cache/restore@v4
        with:
          path: state
          key: seen-${{ github.run_id }}
          restore-keys: |
            seen-

      - name: 单元测试
        run: >-
          pip install pytest && pytest tests/ -q

      - name: 运行舆情监测
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          BARK_GROUP: ${{ vars.BARK_GROUP }}
          BARK_ICON: ${{ vars.BARK_ICON }}
          # 联合报告仓库的固定入口，不随每天的 JSON 文件更新而变化。
          REPORT_URL: https://kiwi-lilo.github.io/aliyun-opinion-report/
          # 个人舆情摘要固定使用 DeepSeek V4 Flash；密钥仍在 GitHub Secrets 管理。
          # 请将 LLM_API_KEY 更新为 DeepSeek API Key，旧 Gemini Key 不能复用。
          LLM_API_BASE: https://api.deepseek.com
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: deepseek-v4-flash
          # 仅有配图的微博切换到视觉模型；无图继续使用上方文本模型。
          LLM_VISION_MODEL: deepseek-v4-flash-vision-exp
        run: python main.py

      - name: 发布 personal.json 到联合报告仓库
        if: success()
        uses: actions/github-script@v7
        env:
          REPORT_REPO: kiwi-lilo/aliyun-opinion-report
        with:
          github-token: ${{ secrets.REPORT_REPO_TOKEN }}
          script: |
            const fs = require('fs');
            const [owner, repo] = process.env.REPORT_REPO.split('/');
            const path = 'personal.json';
            const branch = 'gh-pages';
            const content = Buffer.from(fs.readFileSync(path)).toString('base64');
            let sha;
            try {
              const oldFile = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              sha = oldFile.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              message: `更新个人舆情日报 ${new Date().toISOString().slice(0, 10)}`,
              content,
              sha,
            });
            core.info(`已发布 ${owner}/${repo}/${path}`);

      - name: 保存历史状态
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: seen-${{ github.run_id }}

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "舆情报告-${{ github.run_number }}"
          path: |
            *舆情_*.csv
            *舆情_*.json
          retention-days: 30
          if-no-files-found: ignore
